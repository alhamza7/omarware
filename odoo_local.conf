[options]
addons_path = addons,odoo/addons
admin_passwd = admin
db_host = False
db_port = False
db_user = capo7amzah
db_password = False
db_name = lugal_local
http_port = 8070
logfile = odoo_local.log
log_level = info
data_dir = ./filestore_local

# ========================================
# Performance Configuration - Optimized for 28 CPU cores, 62GB RAM
# ========================================

# Workers: Use multiprocessing for better CPU utilization
# Formula: (CPU cores * 2) + 1, but reasonable limit for development
workers = 16

# Maximum allowed virtual memory per worker (in bytes)
# Set very high for large datasets and complex operations
# ~50GB per worker
limit_memory_soft = 53687091200
limit_memory_hard = 64424509440

# Maximum allowed CPU time per request (in seconds)
# Set very high to effectively disable timeouts
# 24 hours
limit_time_cpu = 86400
limit_time_real = 86400

# Maximum allowed time for cron jobs (in seconds)
# 24 hours for long-running cron jobs
limit_time_real_cron = 86400

# Maximum number of requests per worker before restart
# Set very high to effectively disable restarts
# 1 million requests
limit_request = 1000000

# Database connection pool
# Max connections per worker
db_maxconn = 128

# Enable/disable auto-reload for development
# Set to False for production-like performance
# dev_mode = reload

# Long polling for live updates
# Use with workers > 0
longpolling_port = 8072

# Maximum file upload size (in MB)
# 0 = unlimited
limit_upload = 0

# Cache settings
# Enable caching for better performance
# http_enable = True
# http_interface = 0.0.0.0

# Proxy mode (if behind nginx/apache)
proxy_mode = False

# ========================================
# Server-wide modules (minimal for faster startup)
# ========================================
server_wide_modules = base,web
