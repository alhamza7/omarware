[options]
addons_path = addons,odoo/addons
admin_passwd = admin
db_host = False
db_port = False
db_user = capo7amzah
db_password = False
db_name = lugal_local
http_port = 8070
logfile = odoo_local.log
log_level = info
# Must use ABSOLUTE path for data_dir (relative paths don't work with workers)
data_dir = /home/capo7amzah/Documents/NBS-PROJECT/Lugal-ai/filestore_local

# ============================================================
# Performance — 28 CPU cores · 62 GB RAM
#
# Workers formula  : (CPU × 2) + 1  → capped at a sane dev limit
# Worker count = 9 gives good throughput without thrashing RAM.
# Each worker is an independent process; Odoo spawns one extra
# "cron" worker automatically on top of the count below.
# ============================================================

# HTTP worker processes  (0 = single-threaded / no multiprocessing)
workers = 9

# Long-polling (live chat, bus) — dedicated port, needs workers > 0
longpolling_port = 8072

# Memory limits (per worker, in bytes) — server has 62 GB RAM
# soft: graceful restart after request if exceeded  → 8 GB
# hard: worker killed immediately if exceeded       → 10 GB
limit_memory_soft = 8589934592
limit_memory_hard = 10737418240

# Time limits (in seconds)
# cpu  – pure CPU time per request
# real – wall-clock time per request (includes I/O / SAP calls)
# cron – wall-clock time for background cron jobs
limit_time_cpu       = 600000
limit_time_real      = 1200000
limit_time_real_cron = 18000000

# ============================================================
# Connection & request limits
# ============================================================
# DB connections per worker (9 workers × 16 = 144 total ≤ PG default 200)
db_maxconn = 16

# Requests a worker handles before being recycled (prevents memory drift)
limit_request = 8192

# Maximum upload size in bytes (100 MB)  — 0 = unlimited
limit_upload = 104857600

# ============================================================
# Network / proxy
# ============================================================
proxy_mode = False

# ============================================================
# Server-wide modules (minimal for faster startup)
# ============================================================
server_wide_modules = base,web,nbs_archive
