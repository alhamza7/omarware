[options]
addons_path = addons,odoo/addons
; Use project filestore (attachments + compiled web assets). Without this, Odoo defaults to
; ~/.local/share/Odoo/filestore/ and GET /web/assets/... returns 500 if files only exist here.
data_dir = /home/lugalai/Lugal-ai/data
; Force a default database so custom /api routes work without requiring db selection
db_name = nbs_lugalai
db_host = localhost
db_port = 5432
db_user = odoo_user
db_password = root
; Odoo listens internally behind scripts/ws_proxy.py.
; The proxy owns client-facing 8069 and routes:
;   HTTP       -> 8075
;   /websocket -> 8076
http_port = 8075
gevent_port = 8076
; Single-db mode so requests can auto-select DB (monodb) and /api routes work without extra headers
dbfilter = ^nbs_lugalai$
list_db = True
proxy_mode = True

; Workers — multi-process mode enables WebSocket (gevent worker) and better concurrency
; Formula: 2 * CPU + 1 = 2*45+1 = 91; capped at 16 for safety
workers = 16
limit_memory_soft = 8589934592
limit_memory_hard = 12884901888
max_file_upload_size = 1073741824

; Cron jobs (SAP sync, commercial flags, etc.) can run long. Default limit_time_real is 120s and
; applies to cron threads when limit_time_real_cron is unset → Odoo reloads/kills the server.
limit_time_real = 600
limit_time_real_cron = 28800

; Keep WebSocket connections open indefinitely — do not force-close idle connections.
; Default is 3600 (1 hour) which causes the server to periodically drop every connection
; regardless of user activity. Idle users (AFK) would miss push notifications during
; the brief reconnect window. Setting this to 24 hours (86400 s) effectively removes
; the inactivity-based forced reconnect for normal usage patterns.
websocket_keep_alive_timeout = 86400
