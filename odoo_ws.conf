[options]
# ============================================================
# WebSocket Migration Sandbox Config
# ============================================================
# ALWAYS use this config on the migration branch.
# NEVER point this at lugal_local. DB is lugal_ws_sandbox ONLY.
# ============================================================
addons_path = addons,odoo/addons
admin_passwd = admin
db_host = False
db_port = False
db_user = capo7amzah
db_password = False
db_name = lugal_ws_sandbox

# Different ports so migration sandbox can run alongside dev Odoo
# 8080 is taken by something else on this machine; using 8075/8076
http_port = 8075
gevent_port = 8076

logfile = odoo_ws.log
log_level = info

# Separate filestore — never shares files with lugal_local
data_dir = /home/capo7amzah/Documents/NBS-PROJECT/Lugal-ai/filestore_ws

# ============================================================
# Performance — same spec as odoo_local.conf
# ============================================================
workers = 9
limit_memory_soft = 8589934592
limit_memory_hard = 10737418240
limit_time_cpu       = 600000
limit_time_real      = 1200000
limit_time_real_cron = 18000000
db_maxconn = 16
limit_request = 8192
limit_upload = 1073741824

proxy_mode = False
server_wide_modules = base,web,nbs_archive
