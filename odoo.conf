[options]
# Addons
addons_path = /home/lugalai/Lugal-ai/addons,/home/lugalai/Lugal-ai/odoo/addons
data_dir = /home/lugalai/Lugal-ai/data

# Database
db_host = localhost
db_port = 5432
db_user = odoo_user
db_password = root
dbfilter = ^nbs_lugalai$
db_maxconn = 64

# Admin
admin_passwd = admin

# HTTP
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

# Longpolling
longpolling_port = 8072

# Logging
logfile = /home/lugalai/Lugal-ai/odoo.log
log_level = info
log_handler = :INFO

# Workers (0 for development, 2+ for production)
workers = 0
max_cron_threads = 1

# Timeouts (increased for long operations like OCR)
limit_time_cpu = 600000
limit_time_real = 1200000
limit_time_real_cron = 18000000

# Queue Job Configuration
server_wide_modules = base,web

# Redis for queue_job
; queue_job_redis_host = redis
; queue_job_redis_port = 6379

# CORS (handled in controllers)
# Allow cross-origin requests from frontend

# Demo data
without_demo = all

# Security
list_db = False

# Performance
db_template = template0
unaccent = True

# Memory limits (server has 61 GB RAM, defaults are too low ~2.4 GB)
# soft: trigger GC/reload at 8 GB, hard: kill worker at 10 GB
limit_memory_soft = 8589934592
limit_memory_hard = 10737418240
