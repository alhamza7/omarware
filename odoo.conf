[options]
web.base.url = http://localhost:8069

addons_path = addons,odoo/addons  
db_host = localhost
db_port = 5432
db_user = odoo_user
db_password = root
admin_passwd = admin
dbfilter = ^lugal.*$

http_interface = 0.0.0.0
logfile = odoo.log
without_demo = True

# Debug mode settings
debug_mode = True
log_level = info
log_handler = :INFO                     


xmlrpc_interface = 0.0.0.0


# Timeout settings for long-running operations (like SAP Migration)
limit_time_cpu = 60000
limit_time_real = 60000
limit_time_real_cron = 120000

# wkhtmltopdf / wkhtmltoimage (use forward slashes)
wkhtmltopdf = C:/Program Files/wkhtmltopdf/bin/wkhtmltopdf.exe
wkhtmltoimage = C:/Program Files/wkhtmltopdf/bin/wkhtmltoimage.exe
bin_path = C:/Program Files/wkhtmltopdf/bin

# Workers for PDF generation (0 for development, 2+ for production)
workers = 0

