[options]
# Addons
addons_path = D:\capo_dev\Lugal-ai\addons,D:\capo_dev\Lugal-ai\odoo\addons
data_dir = D:\capo_dev\Lugal-ai\data

# Database
db_host = localhost
db_port = 5432
db_user = odoo_user
db_password = root
dbfilter = ^lugal$
db_maxconn = 64

# Admin
admin_passwd = admin

# HTTP
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True

# Longpolling
longpolling_port = 8072

# Logging
logfile = D:\capo_dev\Lugal-ai\odoo.log
log_level = info
log_handler = :INFO

# Workers (0 for development, 2+ for production)
workers = 0
max_cron_threads = 1

# Timeouts (increased for long operations like OCR)
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

# Queue Job Configuration
server_wide_modules = base,web,queue_job

# Redis for queue_job
; queue_job_redis_host = redis
; queue_job_redis_port = 6379

# CORS (handled in controllers)
# Allow cross-origin requests from frontend

# Demo data
without_demo = all

# Security
list_db = False

# Performance
db_template = template0
unaccent = True
