version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nbs_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo_new}
      POSTGRES_USER: ${POSTGRES_USER:-odoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nbs_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nbs_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nbs_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: nbs_opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - nbs_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: nbs_odoo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - HOST=${POSTGRES_HOST:-postgres}
      - PORT=${POSTGRES_PORT:-5432}
      - USER=${POSTGRES_USER:-odoo_user}
      - PASSWORD=${POSTGRES_PASSWORD:-root}
    volumes:
      - ./nbs_archive:/mnt/extra-addons/nbs_archive:ro
      - odoo_web_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./logs/odoo:/var/log/odoo
    ports:
      - "8069:8069"
      - "8072:8072"  # Longpolling
    networks:
      - nbs_network
    restart: unless-stopped
    command: odoo --config=/etc/odoo/odoo.conf --database=${POSTGRES_DB:-odoo_new}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./nbs-archive-frontend
      dockerfile: Dockerfile
      target: development
    container_name: nbs_frontend
    depends_on:
      - odoo
    volumes:
      - ./nbs-archive-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8069}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8069}
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    networks:
      - nbs_network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0

  nginx:
    image: nginx:alpine
    container_name: nbs_nginx
    depends_on:
      - odoo
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nbs_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opensearch_data:
    driver: local
  odoo_web_data:
    driver: local

networks:
  nbs_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16










